name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dafatri_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The source archive does not contain Android Gradle scaffolding. Generate it first.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name dafatri_flutter .
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bakloria-adabi-android-apk
          path: dafatri_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
