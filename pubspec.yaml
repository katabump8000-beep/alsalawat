name: dafatri
description: Arabic lesson notes and self-test app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
